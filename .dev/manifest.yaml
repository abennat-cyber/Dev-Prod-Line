    - ".dev/schemas/context-map.schema.json"
    - ".dev/schemas/marketplace-registry.schema.json"
    - ".dev/schemas/model-routing-policy.schema.json"
    - ".dev/schemas/model-routing-evaluation-matrix.schema.json"
    - ".dev/schemas/token-compression-policy.schema.json"
    - ".dev/schemas/marketplace-plugin-contract.schema.json"
    - ".dev/schemas/delegation-protocol.schema.json"
    - ".dev/schemas/delegation-roles.schema.json"
    - ".dev/schemas/eval.schema.json"
    - ".dev/schemas/data-classification.schema.json"
  security:
