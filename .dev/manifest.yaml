schema_version: "1.2.0"
canonical_root: ".dev"
name: "vendor-agnostic-agentic-development-environment"
status: "advanced-contract"

principles:
  - ".dev/ is the canonical engineering contract."
  - "adapters/ translate the contract for specific AI tools."
  - "agents execute the contract."
  - "scripts validate the contract."
  - "No adapter is canonical."
  - "Unknown project facts must be marked UNKNOWN."
  - "Advanced agent features must remain vendor-neutral contract modules unless a repository explicitly adds a runtime adapter."
  - "Context discipline and validation should live in scripts, schemas, and CI rather than repeated prompt text."

adapter_policy:
  source_of_truth: ".dev"
  adapter_role: "compatibility-layer"
  allowed:
    - "Point tools to canonical standards, procedures, guardrails, and knowledge."
    - "Translate file names or front matter needed by a specific tool."
  disallowed:
    - "Duplicating canonical rules unless required by the target tool."
    - "Overriding .dev standards from an adapter."
    - "Locking the repository to a specific AI vendor or product."

advanced_features:
  hooks_lifecycle:
    status: "enabled"
    canonical_files:
      - ".dev/hooks/README.md"
      - ".dev/hooks/policy.yaml"
      - ".dev/hooks/guardrail-rules.json"
      - ".dev/hooks/guardrail_enforcer.py"
      - ".dev/hooks/session_memory.py"
  telemetry:
    status: "enabled"
    canonical_files:
      - ".dev/telemetry/README.md"
      - ".dev/telemetry/ledger.jsonl"
  adapter_conformance:
    status: "enabled"
    canonical_files:
      - ".dev/evals/conformance-tasks.yaml"
      - ".dev/evals/conformance-matrix.md"
  skill_ingestion:
    status: "enabled"
    canonical_files:
      - ".dev/skills/ingest-external-skill/skill.md"
  model_routing:
    status: "enabled"
    canonical_files:
      - ".dev/model-routing/README.md"
      - ".dev/model-routing/policy.yaml"
      - ".dev/model-routing/evaluation-matrix.yaml"
  token_compression:
    status: "enabled"
    canonical_files:
      - ".dev/token-compression/README.md"
      - ".dev/token-compression/policy.yaml"
      - ".dev/token-compression/context-ledger.md"
  marketplace_plugins:
    status: "enabled"
    canonical_files:
      - ".dev/marketplace/README.md"
      - ".dev/marketplace/plugin-contract.yaml"
      - ".dev/marketplace/registry.yaml"
  multi_agent_delegation:
    status: "enabled"
    canonical_files:
      - ".dev/delegation/README.md"
      - ".dev/delegation/protocol.yaml"
      - ".dev/delegation/roles.yaml"

required_files:
  root:
    - ".dev/manifest.yaml"
    - ".dev/README.md"
    - ".dev/VERSION"
  build:
    - ".dev/build/status.md"
    - ".dev/build/log.md"
    - ".dev/build/decisions.md"
    - ".dev/build/validation-report.md"
  context:
    - ".dev/context-map.yaml"
  schemas:
